name: Build public engineering handbook gold branches

on:
  push:
    branches:
      - automation/public-handbook-gold-20260727

permissions:
  contents: write

jobs:
  create-handbook-branches:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestrator branch
        uses: actions/checkout@v4
        with:
          ref: automation/public-handbook-gold-20260727
          fetch-depth: 0

      - name: Configure commit attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create coauthored handbook branches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          entries = [
              ('handbook/25-threat-modeling', 'handbook/threat-modeling.md', 'Threat Modeling', 'A repeatable process for identifying assets, trust boundaries, plausible abuse cases, and proportionate controls.', 'Map assets, actors, entry points, and trust boundaries|Prioritize threats by likelihood, impact, and exposure|Track mitigations, residual risk, and validation evidence'),
              ('handbook/26-secrets-management', 'handbook/secrets-management.md', 'Secrets Management', 'Controls for creating, storing, distributing, rotating, revoking, and auditing credentials and cryptographic material.', 'Keep secrets outside source control, prompts, logs, and build artifacts|Use scoped identities and managed secret stores|Test rotation and revocation before an incident'),
              ('handbook/27-backup-recovery', 'handbook/backup-and-recovery.md', 'Backup and Recovery', 'Practices for recoverable data, configuration, and operational state.', 'Define recovery-point and recovery-time objectives|Encrypt, isolate, retain, and monitor backups|Perform restoration drills and record the evidence'),
              ('handbook/28-business-continuity', 'handbook/business-continuity.md', 'Business Continuity', 'Planning for sustained critical operations during provider outages, staffing constraints, security events, and infrastructure failure.', 'Identify critical services, dependencies, and manual fallbacks|Assign decision authority and communication paths|Exercise degraded operation and full recovery'),
              ('handbook/29-service-objectives', 'handbook/service-level-objectives.md', 'Service-Level Objectives', 'A method for defining measurable reliability targets and using error budgets to guide delivery decisions.', 'Select user-centered availability and latency indicators|State measurement windows, exclusions, and data quality|Use error-budget consumption to trigger corrective work'),
              ('handbook/30-change-management', 'handbook/change-management.md', 'Change Management', 'Controls for proposing, reviewing, deploying, verifying, and reversing material changes.', 'Classify change risk and required approvals|Record scope, evidence, rollout, and rollback|Verify the production result rather than assuming deployment success'),
              ('handbook/31-configuration-management', 'handbook/configuration-management.md', 'Configuration Management', 'Practices for deterministic, validated, environment-specific configuration.', 'Version non-secret configuration and validate schemas|Separate development, staging, and production values|Detect drift and fail closed on unsafe defaults'),
              ('handbook/32-logging-privacy', 'handbook/logging-and-privacy.md', 'Logging and Privacy', 'A logging standard that preserves diagnostic value while minimizing sensitive data exposure.', 'Use structured events and stable identifiers|Redact credentials, tokens, private content, and unnecessary personal data|Set access, retention, deletion, and sampling rules'),
              ('handbook/33-secure-coding', 'handbook/secure-coding.md', 'Secure Coding', 'Implementation practices that reduce common input, authorization, dependency, concurrency, and data-handling failures.', 'Validate at trust boundaries and encode output for its context|Centralize authorization and fail closed|Use safe libraries, bounded resources, and explicit error handling'),
              ('handbook/34-code-review', 'handbook/code-review.md', 'Code Review', 'A review discipline focused on correctness, security, operability, maintainability, and evidence.', 'Review behavior and risk rather than formatting alone|Require tests for material invariants and failure paths|Resolve uncertainty before approving irreversible changes'),
              ('handbook/35-feature-flags', 'handbook/feature-flags.md', 'Feature Flags', 'Practices for bounded rollout, capability control, experimentation, and emergency disablement.', 'Define owners, defaults, audience, and expiration|Evaluate authorization again at execution time|Remove stale flags and test both enabled and disabled paths'),
              ('handbook/36-workflow-reliability', 'handbook/workflow-reliability.md', 'Workflow Reliability', 'Controls for queues, retries, idempotency, deadlines, compensation, and durable orchestration.', 'Use stable idempotency keys and bounded retry policies|Expose queue age, depth, failure, and dead-letter state|Design replay and compensation before production use'),
              ('handbook/37-third-party-integrations', 'handbook/third-party-integrations.md', 'Third-Party Integrations', 'A lifecycle for selecting, authorizing, monitoring, and removing external services.', 'Review permissions, data flow, terms, limits, and failure modes|Keep provider credentials isolated and revocable|Plan fallback, migration, and secure decommissioning'),
              ('handbook/38-model-evaluation', 'handbook/model-evaluation.md', 'Model Evaluation', 'Evidence for judging model quality, reliability, cost, latency, safety, and operational fit.', 'Use representative tasks, fixed rubrics, and held-out cases|Measure failure severity, variance, and abstention behavior|Separate benchmark results from production claims'),
              ('handbook/39-prompt-tool-safety', 'handbook/prompt-and-tool-safety.md', 'Prompt and Tool Safety', 'Boundaries for model inputs, retrieved content, tool calls, and externally visible side effects.', 'Treat prompts, retrieval, and model output as untrusted data|Expose only minimal, typed, policy-checked tools|Require deterministic authorization immediately before side effects'),
              ('handbook/40-human-oversight', 'handbook/human-oversight.md', 'Human Oversight', 'A practical allocation of human review and intervention for high-impact automated decisions.', 'Define which actions require preview, approval, or dual control|Give operators clear context, alternatives, and rollback|Measure override, escalation, and missed-intervention patterns'),
              ('handbook/41-auditability', 'handbook/auditability.md', 'Auditability', 'Records that make consequential actions attributable, reconstructable, and reviewable.', 'Capture actor, authority, input reference, policy decision, and outcome|Use tamper-evident retention appropriate to risk|Restrict audit access while preserving investigative usefulness'),
              ('handbook/42-compliance-readiness', 'handbook/compliance-readiness.md', 'Compliance Readiness', 'A control-evidence approach for preparing projects to meet applicable legal, contractual, and policy obligations.', 'Map obligations to owners, controls, and evidence|Document scope, exceptions, and remediation dates|Avoid claiming certification or compliance without independent basis'),
              ('handbook/43-documentation-quality', 'handbook/documentation-quality.md', 'Documentation Quality', 'Standards for accurate, discoverable, maintained, and audience-appropriate technical documentation.', 'State current status, prerequisites, limitations, and ownership|Test commands and examples against supported environments|Archive or correct stale guidance promptly'),
              ('handbook/44-support-operations', 'handbook/support-operations.md', 'Support Operations', 'A method for triaging user reports, communicating status, and converting recurring problems into product improvements.', 'Classify severity, impact, ownership, and response target|Protect private data in tickets and diagnostic bundles|Link incidents, defects, documentation, and follow-up verification'),
              ('handbook/45-product-discovery', 'handbook/product-discovery.md', 'Product Discovery', 'A disciplined process for validating problems, users, constraints, and value before scaling implementation.', 'Use interviews, observation, and behavioral evidence|State assumptions and tests that could disprove them|Prefer small validation loops over premature platform scope'),
              ('handbook/46-experimentation', 'handbook/experimentation.md', 'Experimentation', 'A framework for hypotheses, metrics, guardrails, assignment, analysis, and decision-making.', 'Predefine success, harm guardrails, and stopping rules|Protect assignment integrity and analyze uncertainty|Record the decision, limitations, and follow-up measurement'),
              ('handbook/47-collaboration', 'handbook/collaboration.md', 'Engineering Collaboration', 'Working agreements for ownership, communication, review, escalation, and shared technical context.', 'Make decision rights and interfaces explicit|Use written proposals for consequential changes|Resolve disagreements with evidence and documented tradeoffs'),
              ('handbook/48-open-source-readiness', 'handbook/open-source-readiness.md', 'Open-Source Readiness', 'A release gate for publishing code, documentation, issues, and community processes safely.', 'Remove secrets, private data, internal endpoints, and unsupported claims|Choose a license and document contribution and security channels|Provide reproducible setup, tests, scope, and maintenance expectations'),
          ]

          def run(*args):
              subprocess.run(args, check=True)

          run('git', 'fetch', 'origin', 'main')
          for branch, path, title, summary, practices in entries:
              run('git', 'switch', '--force-create', branch, 'origin/main')
              bullets = '\n'.join(f'- {item}' for item in practices.split('|'))
              content = f'''# {title}

          {summary}

          ## Operating practices

          {bullets}

          ## Review standard

          Changes should be evidence-based, scoped for review, explicit about limitations, and reversible where practical. Credentials, private infrastructure details, and unnecessary personal data must remain outside public artifacts.
          '''
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
              run('git', 'add', path)
              message = f'docs: add {title.lower()}\n\nCo-authored-by: Jonathan Forbes <284077179+forbesexe-gif@users.noreply.github.com>'
              run('git', 'commit', '-m', message)
              run('git', 'push', '--force', 'origin', f'HEAD:refs/heads/{branch}')
          PY
