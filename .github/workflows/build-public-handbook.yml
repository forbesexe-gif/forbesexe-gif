name: Build public engineering handbook branches

on:
  push:
    branches:
      - automation/public-handbook-20260727

permissions:
  contents: write

jobs:
  create-handbook-branches:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestrator branch
        uses: actions/checkout@v4
        with:
          ref: automation/public-handbook-20260727
          fetch-depth: 0

      - name: Configure commit attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create coauthored handbook branches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          entries = [('handbook/01-index', 'handbook/README.md', 'Public Engineering Handbook', "A public reference for Jonathan Forbes's product, engineering, safety, and operations practices.", 'Separate implemented capabilities from plans|Keep credentials and private data out of public artifacts|Use small, reviewable, reversible changes'), ('handbook/02-driven-agentics', 'handbook/driven-agentics.md', 'Driven Agentics', 'The parent product and research organization for independently developed AI-assisted software.', 'Define the user problem before selecting technology|Give each product a clear repository and risk boundary|Require evidence before calling a capability production-ready'), ('handbook/03-koalawire', 'handbook/koalawire.md', 'KoalaWire', 'An authorized defensive security-analysis project for systems, applications, and code owned by the operator or covered by written permission.', 'Record authorization before assessment|Prefer reproducible findings and remediation guidance|Keep invasive capabilities disabled outside controlled test environments'), ('handbook/04-shasweeper', 'handbook/shasweeper.md', 'SHAsweeper', 'A cryptography and authorized-compute research project focused on transparent measurement and Bitcoin protocol study.', 'State the exact algorithm, workload, hardware, and method|Do not label generic SHA-256 results as Bitcoin mining performance|Use only owned or explicitly authorized compute resources'), ('handbook/05-responsible-ai', 'handbook/responsible-ai.md', 'Responsible AI', 'A control model in which AI may analyze and propose while deterministic systems govern authorization and side effects.', 'Treat model output as untrusted input|Keep secrets and regulated data outside prompts|Preserve human accountability for releases and irreversible actions'), ('handbook/06-security-baseline', 'handbook/security-baseline.md', 'Security Baseline', 'Minimum controls that should exist before a project is exposed to users, data, or external services.', 'Apply least privilege and strong authentication|Validate external input and redact sensitive logs|Maintain tested backup, revocation, restore, and rollback procedures'), ('handbook/07-repository-governance', 'handbook/repository-governance.md', 'Repository Governance', 'Standards for keeping repositories understandable, auditable, and safe to operate.', 'Document purpose, status, tests, deployment, and limitations|Protect default branches for material projects|Remove obsolete automation and temporary credentials'), ('handbook/08-release-management', 'handbook/release-management.md', 'Release Management', 'A release process that includes scope, deployment, verification, monitoring, and recovery.', 'Record tests and untested conditions|Prefer staged rollout and bounded exposure|Verify the deployed commit and maintain a usable rollback path'), ('handbook/09-incident-response', 'handbook/incident-response.md', 'Incident Response', 'A containment-first process for unexpected behavior, security events, and operational failures.', 'Stop the affected capability while preserving evidence|Separate confirmed facts from hypotheses|Resume service only after remediation, testing, and accountable approval'), ('handbook/10-cloud-operations', 'handbook/cloud-operations.md', 'Cloud Operations', 'Operational practices for secure, observable, cost-aware cloud services.', 'Inventory and tag resources by project and environment|Monitor capacity, errors, latency, storage, and certificate expiry|Set cost alerts and test backup restoration'), ('handbook/11-data-handling', 'handbook/data-handling.md', 'Data Handling', 'Lifecycle controls for collecting, storing, using, exporting, retaining, and deleting data.', 'Minimize collection and classify sensitivity|Encrypt sensitive data and restrict access by role|Retain source, timestamp, transformation, and quality context'), ('handbook/12-testing-strategy', 'handbook/testing-strategy.md', 'Testing Strategy', 'Evidence-oriented testing across deterministic rules, interfaces, integrations, workflows, security, and operations.', 'Prioritize money, credentials, permissions, and irreversible actions|Test retries, duplication, denial paths, and recovery|Record commands, environments, results, and omissions'), ('handbook/13-observability', 'handbook/observability.md', 'Observability', 'Metrics, logs, traces, health semantics, alerts, and audit records that make system state understandable.', 'Measure rates, latency, errors, saturation, and queue depth|Disclose health-data age and scope|Give every alert an owner and response action'), ('handbook/14-accessibility', 'handbook/accessibility.md', 'Accessibility', 'Design and validation practices that keep essential workflows usable with assistive technology and varied input methods.', 'Use semantic structure, labels, keyboard support, and visible focus|Avoid color-only meaning and respect reduced motion|Combine automated checks with manual keyboard, zoom, and screen-reader review'), ('handbook/15-project-evaluation', 'handbook/project-evaluation.md', 'Project Evaluation', 'A rubric for judging problem clarity, feasibility, risk, validation, usability, reliability, economics, and status integrity.', 'Define evidence that could disprove the thesis|Estimate build, hosting, data, support, and acquisition costs|End reviews with proceed, revise, pause, or stop'), ('handbook/16-learning-roadmap', 'handbook/learning-roadmap.md', 'Technical Learning Roadmap', 'A practical path from systems fundamentals to programming, cloud operations, security, data, and applied AI.', 'Build fluency through small working projects|Read generated code and predict behavior before running it|Explain failures, fixes, evidence, and remaining uncertainty')]

          def run(*args):
              subprocess.run(args, check=True)

          run('git', 'fetch', 'origin', 'main')
          for branch, path, title, summary, practices in entries:
              run('git', 'switch', '--force-create', branch, 'origin/main')
              bullets = '\n'.join(f'- {item}' for item in practices.split('|'))
              content = f'''# {title}

          {summary}

          ## Operating practices

          {bullets}

          ## Review standard

          Changes should be evidence-based, scoped for review, explicit about limitations, and reversible where practical. Credentials, private infrastructure details, and unnecessary personal data must remain outside public artifacts.
          '''
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
              run('git', 'add', path)
              msg = f'docs: add {title.lower()}\n\nCo-authored-by: Jonathan Forbes <284077179+forbesexe-gif@users.noreply.github.com>'
              run('git', 'commit', '-m', msg)
              run('git', 'push', '--force', 'origin', f'HEAD:refs/heads/{branch}')
          PY
